<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUE VES AQUI</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <main class="scene" id="scene">

        <button id="startButton">Sorpresita todo flopera uwu</button>

        <div class="flower-stage" id="flowerStage">
            <div class="flower">
                <div class="petal" style="--angle: 0deg; --delay: 0s;"></div>
                <div class="petal" style="--angle: 36deg; --delay: 0.15s;"></div>
                <div class="petal" style="--angle: 72deg; --delay: 0.3s;"></div>
                <div class="petal" style="--angle: 108deg; --delay: 0.45s;"></div>
                <div class="petal" style="--angle: 144deg; --delay: 0.6s;"></div>
                <div class="petal" style="--angle: 180deg; --delay: 0.75s;"></div>
                <div class="petal" style="--angle: 216deg; --delay: 0.9s;"></div>
                <div class="petal" style="--angle: 252deg; --delay: 1.05s;"></div>
                <div class="petal" style="--angle: 288deg; --delay: 1.2s;"></div>
                <div class="petal" style="--angle: 324deg; --delay: 1.35s;"></div>
                <div class="center"></div>
            </div>
        </div>

        <section class="message" id="message">
            <h1>Gracias por todo, autistona</h1>

            <p>
                (no había presupuesto para flores reales déjame 😭 hice lo que pude 😭😭😭)<br>
                ME RE COSTÓ, PORFA VALÓRALO 😭
            </p>

            <strong>
                VAS A CAER DAFNE ILLANES
                <span>(graciasportufrenship)</span>
            </strong>
        </section>

        <div class="corner-message" id="cornerMessage">
            sicsebenn🗣️🗣️🔥🔥
        </div>

        <div class="particles" id="particles"></div>

    </main>

    <audio id="music" src="audio/wild-side.mp3" preload="auto"></audio>

    <script src="js/script.js"></script>
</body>
</html>
